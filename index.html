<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full TradingView Terminal</title>
  <style>
    /* Reset margins and force full screen view */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #131722;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* Full-screen container for the widget */
    #tv_chart_container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- Main Trading Container -->
  <div id="tv_chart_container"></div>

  <!-- Load TradingView's Advanced Technical Analysis Library -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  
  <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
      new TradingView.widget({
        // Geometry & Layout
        "autosize": true,
        "container_id": "tv_chart_container",
        
        // Initial Market Symbol & Timeframe
        "symbol": "BINANCE:BTCUSDT",
        "interval": "D",                  // D = 1 Day, 60 = 1 Hour, 15 = 15 Mins
        "timezone": "Etc/UTC",
        "theme": "dark",                   // 'dark' or 'light'
        "style": "1",                      // 1 = Candlesticks, 2 = Bars, 3 = Line, 8 = Heikin Ashi
        "locale": "en",
        
        // 🛠️ TOOLBARS & DRAWINGS (ALL 110+ DRAWING TOOLS)
        "hide_side_toolbar": false,        // Enables Left Drawing Toolbar (Trendlines, Fibonacci, Pitchforks)
        "hide_top_toolbar": false,         // Enables Top Navigation Toolbar
        "allow_symbol_change": true,       // Allows searching any Stock, Crypto, Forex, or Index
        "save_image": true,                // Enables Chart Screenshot/Download feature
        
        // 📊 TECHNICAL ANALYSIS & INDICATORS (100+ Indicators)
        "withdateranges": true,            // Date Range Selectors at bottom (1D, 5D, 1M, 1Y, ALL)
        "enable_publishing": false,        // Publish Ideas button
        "show_popup_button": true,         // Allows expanding chart in popup window
        "popup_width": "1000",
        "popup_height": "650",
        
        // 📈 WATCHLIST, DETAILS & NEWS PANELS (Right Sidebar Features)
        "details": true,                   // Displays Key Metrics (24h High/Low, Volume, Market Cap)
        "hotlist": true,                   // Displays Top Gainers / Losers List
        "calendar": true,                  // Displays Economic Earnings Calendar
        "news": ["headlines"],            // Enables Live Market News Feed
        "watchlist": [                     // Default Symbols in Right Watchlist
          "BINANCE:BTCUSDT",
          "BINANCE:ETHUSDT",
          "NASDAQ:AAPL",
          "NASDAQ:NVDA",
          "NASDAQ:TSLA",
          "FX:EURUSD",
          "OANDA:XAUUSD"
        ],
        
        // 🛠️ ADVANCED CHART CONTROL OPTIONS
        "studies": [                       // Default Indicators to load on startup
          "RSI@tv-basicstudies",           // Relative Strength Index
          "MASimple@tv-basicstudies",      // Moving Average
          "MACD@tv-basicstudies"           // MACD
        ],
        
        // Advanced Chart Customization Flags
        "disabled_features": [
          // Remove items here if you want to disable specific default popups
        ],
        "enabled_features": [
          "study_templates",               // Save indicator setups
          "use_localstorage_for_settings", // Saves user drawings/indicators in browser cache
          "side_toolbar_in_fullscreen_mode",
          "header_in_fullscreen_mode"
        ]
      });
    });
  </script>

</body>
</html>
