<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Terminal with Integrated Top Bar Replay</title>
  
  <!-- TradingView Open-Source Library for Replay Mode -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <!-- TradingView Free Terminal Script -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #131722;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Outer App Layout */
    .app-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Top Bar Header */
    .top-bar {
      display: flex;
      background-color: #1e222d;
      border-bottom: 1px solid #2a2e39;
      padding: 8px 16px;
      gap: 12px;
      align-items: center;
      height: 48px;
      z-index: 10;
    }

    /* Mode Selector Buttons */
    .tab-btn {
      background: transparent;
      border: 1px solid #363a45;
      color: #b2b5be;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .tab-btn:hover { background: #2a2e39; color: #fff; }
    .tab-btn.active {
      background: #2962ff;
      border-color: #2962ff;
      color: #ffffff;
    }

    .divider {
      width: 1px;
      height: 20px;
      background-color: #363a45;
    }

    /* Inline Replay Controls */
    .replay-controls {
      display: none;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .replay-controls.active {
      display: flex;
    }

    .replay-btn {
      background: #2962ff;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .replay-btn:hover { background: #1e54e4; }

    .speed-select {
      background: #131722;
      color: #fff;
      border: 1px solid #363a45;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 0.82rem;
    }

    .status-text {
      margin-left: auto;
      font-size: 0.82rem;
      color: #787b86;
    }

    /* Container Area */
    .view-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 48px);
      position: relative;
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .view.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    #replay-chart-box {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="app-layout">
    
    <!-- TOP BAR -->
    <div class="top-bar">
      <button class="tab-btn active" onclick="switchView('terminal')">📈 Full Terminal</button>
      <button class="tab-btn" onclick="switchView('replay')">🔄 Replay Mode</button>

      <div class="divider" id="divider" style="display:none;"></div>

      <!-- INLINE REPLAY BUTTONS -->
      <div class="replay-controls" id="replay-controls">
        <button class="replay-btn" id="playBtn">▶ Play</button>
        <button class="replay-btn" id="stepBtn">⏭ Next Bar</button>
        <button class="replay-btn" id="resetBtn">🔄 Reset</button>
        
        <label style="font-size:0.8rem; color:#b2b5be;">
          Speed:
          <select class="speed-select" id="speedSelect">
            <option value="1000">1 bar/sec</option>
            <option value="500" selected>2 bars/sec</option>
            <option value="200">5 bars/sec</option>
          </select>
        </label>

        <span class="status-text" id="status">Loading...</span>
      </div>
    </div>

    <!-- MAIN VIEWS -->
    <div class="view-container">
      
      <!-- VIEW 1: TRADINGVIEW TERMINAL -->
      <div id="terminal-view" class="view active">
        <div id="tv_chart_container" style="width:100%; height:100%;"></div>
      </div>

      <!-- VIEW 2: REPLAY CHART -->
      <div id="replay-view" class="view">
        <div id="replay-chart-box"></div>
      </div>

    </div>

  </div>

  <script>
    // Global State Variables
    let chart = null, candleSeries = null;
    let fullData = [], currentIndex = 30, isPlaying = false, replayTimer = null;
    let replayInitialized = false;

    // --- 1. Tab Switcher Function ---
    function switchView(mode) {
      const terminalBtn = document.querySelectorAll('.tab-btn')[0];
      const replayBtn = document.querySelectorAll('.tab-btn')[1];
      const terminalView = document.getElementById('terminal-view');
      const replayView = document.getElementById('replay-view');
      const replayControls = document.getElementById('replay-controls');
      const divider = document.getElementById('divider');

      if (mode === 'terminal') {
        terminalBtn.classList.add('active');
        replayBtn.classList.remove('active');
        terminalView.classList.add('active');
        replayView.classList.remove('active');
        replayControls.classList.remove('active');
        divider.style.display = 'none';
      } else {
        replayBtn.classList.add('active');
        terminalBtn.classList.remove('active');
        replayView.classList.add('active');
        terminalView.classList.remove('active');
        replayControls.classList.add('active');
        divider.style.display = 'block';

        // Initialize Lightweight Chart on first click or trigger resize
        if (!replayInitialized) {
          initReplayChart();
        } else if (chart) {
          setTimeout(() => {
            const container = document.getElementById('replay-chart-box');
            chart.resize(container.clientWidth, container.clientHeight);
          }, 50);
        }
      }
    }

    // --- 2. Full TradingView Widget ---
    new TradingView.widget({
      "autosize": true,
      "symbol": "BINANCE:BTCUSDT",
      "interval": "D",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "hide_side_toolbar": false,
      "hide_top_toolbar": false,
      "allow_symbol_change": true,
      "withdateranges": true,
      "details": true,
      "watchlist": ["BINANCE:BTCUSDT", "BINANCE:ETHUSDT", "NASDAQ:AAPL", "OANDA:XAUUSD"],
      "studies": ["RSI@tv-basicstudies", "MASimple@tv-basicstudies"],
      "container_id": "tv_chart_container"
    });

    // --- 3. Replay Chart Initialization ---
    function initReplayChart() {
      replayInitialized = true;
      const container = document.getElementById('replay-chart-box');

      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1f2432' }, horzLines: { color: '#1f2432' } }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#089981', downColor: '#f23645',
        borderUpColor: '#089981', borderDownColor: '#f23645'
      });

      // Try fetching Binance API data, fall back to dummy data if API fails
      fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=200')
        .then(res => res.json())
        .then(rawData => {
          fullData = rawData.map(d => ({
            time: d[0] / 1000,
            open: parseFloat(d[1]),
            high: parseFloat(d[2]),
            low: parseFloat(d[3]),
            close: parseFloat(d[4])
          }));
          loadDataset();
        })
        .catch(err => {
          console.warn('API Fetch failed, loading backup offline data', err);
          fullData = generateFallbackData();
          loadDataset();
        });

      window.addEventListener('resize', () => {
        if (chart && container) {
          chart.resize(container.clientWidth, container.clientHeight);
        }
      });
    }

    function loadDataset() {
      candleSeries.setData(fullData.slice(0, currentIndex));
      document.getElementById('status').innerText = `Bar ${currentIndex} of ${fullData.length}`;
    }

    // Backup Data Generator in case API is blocked
    function generateFallbackData() {
      const data = [];
      let time = Math.floor(Date.now() / 1000) - (200 * 86400);
      let open = 60000;
      for (let i = 0; i < 200; i++) {
        let change = (Math.random() - 0.49) * 1200;
        let close = open + change;
        let high = Math.max(open, close) + Math.random() * 400;
        let low = Math.min(open, close) - Math.random() * 400;
        data.push({ time: time + (i * 86400), open, high, low, close });
        open = close;
      }
      return data;
    }

    // --- 4. Replay Control Handlers ---
    function stepForward() {
      if (currentIndex < fullData.length) {
        candleSeries.update(fullData[currentIndex++]);
        document.getElementById('status').innerText = `Bar ${currentIndex} of ${fullData.length}`;
      } else { pauseReplay(); }
    }

    function playReplay() {
      isPlaying = true;
      document.getElementById('playBtn').innerText = '⏸ Pause';
      replayTimer = setInterval(stepForward, parseInt(document.getElementById('speedSelect').value));
    }

    function pauseReplay() {
      isPlaying = false;
      document.getElementById('playBtn').innerText = '▶ Play';
      clearInterval(replayTimer);
    }

    document.getElementById('playBtn').onclick = () => isPlaying ? pauseReplay() : playReplay();
    document.getElementById('stepBtn').onclick = () => { pauseReplay(); stepForward(); };
    document.getElementById('resetBtn').onclick = () => {
      pauseReplay();
      currentIndex = 30;
      loadDataset();
    };
  </script>
</body>
</html>
