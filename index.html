<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free No-Login Chart Replay</title>
  <!-- Official TradingView Lightweight Charts Library -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #131722;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background-color: #1e222d;
      border-bottom: 1px solid #2a2e39;
      flex-wrap: wrap;
    }

    button, select {
      background: #2962ff;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    button:hover { background: #1e54e4; }
    button:disabled { background: #363a45; color: #787b86; cursor: not-allowed; }

    .status-text {
      margin-left: auto;
      font-size: 0.85rem;
      color: #787b86;
    }

    #chart-container {
      flex: 1;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button id="playBtn">▶ Play Replay</button>
    <button id="stepBtn">⏭ Next Bar</button>
    <button id="resetBtn">🔄 Reset Replay</button>
    
    <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem;">
      Speed:
      <select id="speedSelect">
        <option value="1000">1 bar/sec</option>
        <option value="500" selected>2 bars/sec</option>
        <option value="200">5 bars/sec</option>
        <option value="100">10 bars/sec</option>
      </select>
    </label>

    <div class="status-text" id="status">Loading historical candles...</div>
  </div>

  <div id="chart-container"></div>

  <script>
    let fullData = [];
    let currentIndex = 30; // Start replay showing initial 30 candles
    let isPlaying = false;
    let replayTimer = null;

    // 1. Initialize TradingView Lightweight Chart
    const container = document.getElementById('chart-container');
    const chart = LightweightCharts.createChart(container, {
      layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#1f2432' }, horzLines: { color: '#1f2432' } },
      timeScale: { timeVisible: true, secondsVisible: false }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#089981', downColor: '#f23645',
      borderUpColor: '#089981', borderDownColor: '#f23645',
      wickUpColor: '#089981', wickDownColor: '#f23645'
    });

    // 2. Fetch Real Historical BTC/USDT Candles from Public Binance REST API (No auth needed)
    async function loadRealData() {
      try {
        const response = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=200');
        const rawData = await response.json();
        
        fullData = rawData.map(item => ({
          time: item[0] / 1000, // Unix timestamp in seconds
          open: parseFloat(item[1]),
          high: parseFloat(item[2]),
          low: parseFloat(item[3]),
          close: parseFloat(item[4])
        }));

        renderChart();
      } catch (err) {
        document.getElementById('status').innerText = 'Error loading market data.';
        console.error(err);
      }
    }

    // 3. Render initial slice of data
    function renderChart() {
      candleSeries.setData(fullData.slice(0, currentIndex));
      updateStatus();
    }

    function updateStatus() {
      document.getElementById('status').innerText = `Bar ${currentIndex} of ${fullData.length}`;
    }

    // 4. Replay Control Functions
    function stepForward() {
      if (currentIndex < fullData.length) {
        candleSeries.update(fullData[currentIndex]);
        currentIndex++;
        updateStatus();
      } else {
        pauseReplay();
      }
    }

    function playReplay() {
      isPlaying = true;
      document.getElementById('playBtn').innerText = '⏸ Pause';
      const intervalMs = parseInt(document.getElementById('speedSelect').value);
      replayTimer = setInterval(stepForward, intervalMs);
    }

    function pauseReplay() {
      isPlaying = false;
      document.getElementById('playBtn').innerText = '▶ Play Replay';
      clearInterval(replayTimer);
    }

    // Event Handlers
    document.getElementById('playBtn').onclick = () => isPlaying ? pauseReplay() : playReplay();
    document.getElementById('stepBtn').onclick = () => { pauseReplay(); stepForward(); };
    document.getElementById('resetBtn').onclick = () => {
      pauseReplay();
      currentIndex = 30;
      renderChart();
    };

    document.getElementById('speedSelect').onchange = () => {
      if (isPlaying) {
        pauseReplay();
        playReplay();
      }
    };

    // Auto resize chart window
    window.onresize = () => chart.resize(container.clientWidth, container.clientHeight);

    // Initial Start
    loadRealData();
  </script>

</body>
</html>
